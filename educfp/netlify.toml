# Configuration Netlify — EduCFP Lambanyi

[build]
  functions = "netlify/functions"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/firebase-layer.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/app.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/ia"
  to = "/.netlify/functions/ia"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
